apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

react {
    /* Folders */
}

def enableProguardInReleaseBuilds = true
def jksFilePath = 'elenza_keystore.jks'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.elenza.app"
    defaultConfig {
        applicationId "com.elenza.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('elenza_debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Environment-driven signing configuration for enterprise security and CI/CD safety
            storeFile file(System.getenv("ELENZA_RELEASE_STORE_FILE") ?: jksFilePath)
            storePassword System.getenv("ELENZA_RELEASE_STORE_PASSWORD") ?: 'elenza123'
            keyAlias System.getenv("ELENZA_RELEASE_KEY_ALIAS") ?: 'elenza'
            keyPassword System.getenv("ELENZA_RELEASE_KEY_PASSWORD") ?: 'elenza123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
    }

    exclude group: "com.thingclips.smart", module: 'thingsmart-modularCampAnno'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // The React Native library dependency
    implementation("com.facebook.react:react-android")

    // Tuya required dependencies
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.14.9'
    implementation 'com.thingclips.smart:thingsmart:7.5.6'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

