workflows:
  ios-flutter-build:
    name: iOS Flutter Build (Elenza Pro)
    working_directory: Elenza_Pro
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build iOS app (Unsigned for Sideloadly)
        script: |
          # Upgrade packages to fix Flutter 3.22+ compatibility issues
          flutter pub upgrade
          
          # 1. Build flutter framework and iOS project (might fail at code signing, we allow it to fail using || true)
          flutter build ios --release --no-codesign || true
          
          # 2. Force xcodebuild to build the release scheme without any code signing requirements
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT=$(PWD)/build
          cd ..
          
          # 3. Package the resulting .app into a Payload folder to create an unsigned .ipa for Sideloadly
          rm -rf Payload ElenzaPro_Unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find . -type d -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found! Here is what we found:"
            find . -name "*.app"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q ElenzaPro_Unsigned.ipa Payload
    artifacts:
      - ElenzaPro_Unsigned.ipa
